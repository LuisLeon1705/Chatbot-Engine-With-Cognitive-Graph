# ---------------------------------------------------------------------------- desktop app (backend)

[app]
start_failed = { en = "Could not start Chats in {dir}: {error}", es = "No se pudo iniciar Chats en {dir}: {error}" }
bad_world = { en = "invalid world: {key}", es = "mundo inválido: {key}" }
