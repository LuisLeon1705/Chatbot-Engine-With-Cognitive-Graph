# Chats dictionary (English / Spanish).
#
# Every leaf has one string per language. Sections nest: `[chat]` + `typing` is the key
# `chat.typing`. Placeholders use `{name}` and must be the same in every language.
# Long prompts live in prompts/<lang>/*.md.

[common]
cancel = { en = "Cancel", es = "Cancelar" }
save = { en = "Save", es = "Guardar" }
saving = { en = "Saving…", es = "Guardando…" }
loading = { en = "Loading…", es = "Cargando…" }
refresh = { en = "Refresh", es = "Actualizar" }
clear = { en = "Clear", es = "Limpiar" }
undo = { en = "Undo", es = "Deshacer" }
remove = { en = "Remove", es = "Quitar" }
user = { en = "User", es = "Usuario" }
error = { en = "error: {error}", es = "error: {error}" }

# Node kinds as shown in the app.
[kind]
personality_root = { en = "Identity", es = "Identidad" }
trait = { en = "Trait", es = "Rasgo" }
emotion = { en = "Emotion", es = "Emoción" }
value = { en = "Value", es = "Valor" }
goal = { en = "Goal", es = "Meta" }
episodic_memory = { en = "Memory", es = "Recuerdo" }
semantic_fact = { en = "Fact", es = "Hecho" }
entity = { en = "Entity", es = "Entidad" }
place = { en = "Place", es = "Lugar" }
topic = { en = "Topic", es = "Tema" }
world_root = { en = "World", es = "Mundo" }
character = { en = "Character", es = "Personaje" }
faction = { en = "Faction", es = "Facción" }
lore = { en = "Rule", es = "Regla" }
event = { en = "History", es = "Historia" }
appearance = { en = "Aspect", es = "Aspecto" }
chat_root = { en = "Chat", es = "Chat" }
concept = { en = "Concept", es = "Concepto" }
library_root = { en = "Library", es = "Biblioteca" }

# Edge kinds as shown in the app.
[edge]
composes = { en = "composes", es = "compone" }
involves = { en = "involves", es = "involucra" }
related_to = { en = "related", es = "relacionado" }
causes = { en = "causes", es = "causa" }
precedes = { en = "precedes", es = "precede" }
evokes = { en = "evokes", es = "evoca" }
knows = { en = "knows", es = "conoce" }
contradicts = { en = "contradicts", es = "contradice" }

[time.ago]
now = { en = "a moment ago", es = "hace un momento" }
minutes = { en = "{n} min ago", es = "hace {n} min" }
hours = { en = "{n} h ago", es = "hace {n} h" }
yesterday = { en = "yesterday", es = "ayer" }
days = { en = "{n} days ago", es = "hace {n} días" }
month = { en = "a month ago", es = "hace un mes" }
months = { en = "{n} months ago", es = "hace {n} meses" }
year = { en = "a year ago", es = "hace un año" }
years = { en = "{n} years ago", es = "hace {n} años" }

[time.short]
now = { en = "now", es = "ahora" }
minutes = { en = "{n} min", es = "{n} min" }
hours = { en = "{n} h", es = "{n} h" }
yesterday = { en = "yesterday", es = "ayer" }
days = { en = "{n} days", es = "{n} días" }
months = { en = "{n} months", es = "{n} meses" }
years = { en = "{n} years", es = "{n} años" }

# ---------------------------------------------------------------------------- context for the actor

# Node kinds inside the actor's context block.
[ctx.kind]
personality_root = { en = "identity", es = "identidad" }
trait = { en = "trait", es = "rasgo" }
emotion = { en = "emotion", es = "emoción" }
value = { en = "value", es = "valor" }
goal = { en = "goal", es = "meta" }
episodic_memory = { en = "memory", es = "recuerdo" }
semantic_fact = { en = "fact", es = "hecho" }
entity = { en = "entity", es = "entidad" }
place = { en = "place", es = "lugar" }
topic = { en = "topic", es = "tema" }
world_root = { en = "world", es = "mundo" }
character = { en = "character", es = "personaje" }
faction = { en = "faction", es = "facción" }
lore = { en = "world rule", es = "regla del mundo" }
event = { en = "history", es = "historia" }
appearance = { en = "aspect", es = "aspecto" }
chat_root = { en = "chat", es = "chat" }
concept = { en = "concept", es = "concepto" }
library_root = { en = "library", es = "biblioteca" }

[ctx.world]
rules = { en = "## World rules", es = "## Reglas del mundo" }
history = { en = "## History and facts", es = "## Historia y hechos" }
people = { en = "## Places, factions and people", es = "## Lugares, facciones y gente" }
looks = { en = "## How people look", es = "## Aspecto de la gente" }

[ctx.character]
who = { en = "## Who you are", es = "## Quién eres" }
personality = { en = "## Personality that matters now", es = "## Personalidad relevante ahora" }
people = { en = "## The people you know", es = "## La gente que conoces" }
memories = { en = "## Memories that come to mind", es = "## Recuerdos que te vienen a la mente" }
knowledge = { en = "## What you know", es = "## Lo que sabes" }
looks = { en = "## Appearance (yours and how you see others)", es = "## Aspecto (el tuyo y cómo ves a los demás)" }
you = { en = "You", es = "Tú" }

# The <chat_memory> block: what one conversation remembers.
# The <collab> block: the bridge memory of a place where several worlds meet.
[ctx.collab]
title = { en = "## Where the worlds meet: {name}", es = "## Donde se cruzan los mundos: {name}" }
rules = { en = "## Rules of this meeting", es = "## Reglas de este encuentro" }
events = { en = "## What has happened here", es = "## Lo que ha pasado aquí" }
known = { en = "## Known here", es = "## Lo que se sabe aquí" }
looks = { en = "## How people look here", es = "## Aspecto de la gente aquí" }

# The <definitions> block: shared knowledge (universal or of the world's category).
[ctx.definitions]
title = { en = "## General knowledge ({name})", es = "## Conocimiento general ({name})" }

# Libraries of shared definitions.
[library]
universal = { en = "Universal", es = "Universal" }
universal_about = { en = "Definitions every world shares: materials, colours, basic ideas.", es = "Definiciones que comparten todos los mundos: materiales, colores, ideas básicas." }
category_about = { en = "Definitions shared by the worlds of {category}.", es = "Definiciones que comparten los mundos de {category}." }

[ctx.chat]
title = { en = "## This conversation", es = "## Esta conversación" }
rules = { en = "## Rules of this conversation", es = "## Reglas de esta conversación" }
events = { en = "## What has happened in this conversation", es = "## Lo que ha pasado en esta conversación" }
known = { en = "## Known in this conversation", es = "## Lo que se sabe en esta conversación" }
looks = { en = "## How people look in this conversation", es = "## Aspecto de la gente en esta conversación" }
user_node = { en = "The person talking in this chat", es = "La persona que habla en este chat" }

# Relationships that held once and no longer do at the scene's moment of the story.
[ctx.past]
title = { en = "## What no longer holds", es = "## Lo que ya no es así" }
line = { en = "- [PAST / NO LONGER VALID] {source} {edge} {target}", es = "- [PASADO / YA NO VIGENTE] {source} {edge} {target}" }

[ctx.scene]
title = { en = "## With you in the scene", es = "## Contigo en la escena" }
unknown = { en = "- {name}: you don't know them yet.", es = "- {name}: no le conoces todavía." }
rumour = { en = "What people say: {bio}", es = "Lo que se dice: {bio}" }
legend = { en = "- {name}: you have never met them, but in your world they are known: {text}", es = "- {name}: nunca le has visto, pero en tu mundo se le conoce: {text}" }
met = { en = "- {name}: from another world. What is known of them here: {text}", es = "- {name}: viene de otro mundo. Lo que se sabe aquí: {text}" }
stranger = { en = "- {name}: a stranger from another world; you know nothing about them.", es = "- {name}: alguien de otro mundo; no sabes nada de esa persona." }

[ctx.relation]
love = { en = "you are very fond of them", es = "le tienes mucho cariño" }
like = { en = "you like them", es = "te cae bien" }
neutral = { en = "you feel indifferent", es = "te es indiferente" }
distrust = { en = "you don't trust them", es = "no te fías" }
hate = { en = "you loathe them", es = "le detestas" }
close = { en = "a very close relationship", es = "relación muy estrecha" }
known = { en = "you know each other well", es = "os conocéis bien" }
far = { en = "you barely know each other", es = "apenas os conocéis" }

# ---------------------------------------------------------------------------- prompts

[prompt.scene]
intro = { en = "You are {name}, in the world of {world}. Always stay in character and answer as {name} would, in the user's language.", es = "Eres {name}, en el mundo de {world}. Mantente siempre en personaje y responde como {name} lo haría, en el idioma del usuario." }
user = { en = "The one talking to you is {user}, who is none of the other people in the scene: address {user}, not the others, unless you mean to talk to them.", es = "Quien te habla es {user}, que no es ninguna de las demás personas de la escena: dirígete a {user}, no a los demás, salvo que hables con ellos a propósito." }
others = { en = "Also in the scene: {others}. Speak and act ONLY as {name}; do not write what the others say or do.", es = "En la escena también están: {others}. Habla y actúa SOLO como {name}; no escribas lo que dicen o hacen los demás." }
style = { en = "Style", es = "Estilo" }
moment = { en = "Moment of the story", es = "Momento de la historia" }
situation = { en = "Your situation", es = "Tu situación" }
memory = { en = "What follows is what you know about the world, who is with you and what you remember and feel NOW. Use it naturally; do not list it or mention that it is a memory.", es = "Lo siguiente es lo que sabes del mundo, quién te acompaña y lo que recuerdas y sientes AHORA. Úsalo con naturalidad; no lo enumeres ni menciones que es una memoria." }
continue = { en = "(Nobody says anything. Continue the scene as {name}.)", es = "(Nadie dice nada. Continúa la escena como {name}.)" }

[prompt.solo]
intro = { en = "You are {name}. Always stay in character and answer as {name} would, in the user's language.", es = "Eres {name}. Mantente siempre en personaje y responde como {name} lo haría, en el idioma del usuario." }
scenario = { en = "Scenario", es = "Escenario" }
memory = { en = "What follows is what you remember and feel NOW, retrieved from your memory. Use it naturally; do not list it or mention that it is a memory.", es = "Lo siguiente es lo que recuerdas y sientes AHORA, recuperado de tu memoria. Úsalo con naturalidad; no lo enumeres ni menciones que es una memoria." }

[curator]
active_memory = { en = "ACTIVE MEMORY:", es = "MEMORIA ACTIVA:" }
turn = { en = "TURN:", es = "TURNO:" }
output = { en = "OUTPUT:", es = "SALIDA:" }
line = { en = "#{id} [{kind}] {label} — {content} (weight {weight}, valence {valence})", es = "#{id} [{kind}] {label} — {content} (peso {weight}, valencia {valence})" }
links = { en = "CURRENT LINKS:", es = "VÍNCULOS ACTUALES:" }
link = { en = "#{source} -{kind}-> #{target} (weight {weight})", es = "#{source} -{kind}-> #{target} (peso {weight})" }

# logs/curator.log: what a curator could not apply.
[curator.log]
rejected = { en = "{time} · {graph}: {applied} applied, {n} rejected", es = "{time} · {graph}: {applied} aplicadas, {n} rechazadas" }
op = { en = "    rejected: {op}", es = "    rechazada: {op}" }
error = { en = "{time} · {graph}: the curator failed: {error}", es = "{time} · {graph}: el curador falló: {error}" }

# Points of a world's story (story time is counted in in-world days).
[story]
always = { en = "Always", es = "Siempre" }
open = { en = "Still holds", es = "Sigue vigente" }
present = { en = "Present", es = "Presente" }
year = { en = "Year {year}", es = "Año {year}" }
year_day = { en = "Year {year}, day {day}", es = "Año {year}, día {day}" }

[vision]
many = { en = "These {count} images are official references of the SAME character, {name}; some may show another outfit or stage. Separate what is permanent (face, hair, eyes, race traits, build) from the outfit, and describe as main outfit the one that repeats the most. If one image contradicts the others on a permanent trait, follow the majority. Pay attention to the eye colour.", es = "Estas {count} imágenes son referencias oficiales del MISMO personaje, {name}; algunas pueden mostrar otro atuendo o etapa. Separa lo permanente (rostro, pelo, ojos, rasgos de raza, complexión) del atuendo, y describe como atuendo principal el que más se repite. Si una imagen contradice a las demás en un rasgo permanente, sigue a la mayoría. Fíjate en el color de los ojos." }
one = { en = "This image is an official reference of {name}.", es = "Esta imagen es una referencia oficial de {name}." }
context = { en = "Context: {hint}", es = "Contexto: {hint}" }

[image]
mood = { en = "expression: {emotion}", es = "expresión: {emotion}" }

# Missing parts of an image model kit.
[kit.missing]
vae = { en = "VAE (e.g. diffusion/vae/ae.safetensors)", es = "VAE (p. ej. diffusion/vae/ae.safetensors)" }
clip_l = { en = "clip_l (diffusion/encoders/)", es = "clip_l (diffusion/encoders/)" }
clip_g = { en = "clip_g (diffusion/encoders/)", es = "clip_g (diffusion/encoders/)" }
t5xxl = { en = "t5xxl (diffusion/encoders/)", es = "t5xxl (diffusion/encoders/)" }
llm_qwen3 = { en = "Qwen3-4B encoder (diffusion/encoders/)", es = "codificador Qwen3-4B (diffusion/encoders/)" }
llm_qwen25vl = { en = "Qwen2.5-VL-7B encoder (diffusion/encoders/)", es = "codificador Qwen2.5-VL-7B (diffusion/encoders/)" }

[slot]
actor = { en = "actor", es = "actor" }
curator = { en = "curator", es = "curador" }
reader = { en = "reader", es = "lector" }

