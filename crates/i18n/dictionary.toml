# ---------------------------------------------------------------------------- CLI

[cli]
help = { en = """
chats models                                      what is in models/ and which role each model gets
chats worlds                                      worlds and characters
chats seed <file.toml> [--appearance-only]        creates a whole world (see docs/SEEDS.md),
                                                  or only re-applies its appearance to an existing one
chats context <category>/<world> <character> "message" [--with A,B] [--as Name] [--at Moment]   (no models)
chats chat <category>/<world> <character> [--with A,B] [--as Name] [--at Moment]
chats memory <category>/<world> <character> [N]   last N nodes learned (no models)
chats image <category>/<world> <character> [scene…]
chats stress [nodes…]                             memory benchmark with synthetic graphs (no models)
chats appearance <category>/<world> <character> ["visual description"]   (no models)
chats reference <category>/<world> <character> [images…] [--add] [--dry-run] [--reader <model>]
                                                  describes all of its references with the vision reader
chats lang [en|es]                                shows or changes the language

Run it from the project folder: it uses config/, models/, worlds/ and logs/.""", es = """
chats models                                      qué hay en models/ y qué rol tendría cada modelo
chats worlds                                      mundos y personajes
chats seed <archivo.toml> [--appearance-only]     crea un mundo completo (ver docs/SEEDS.md),
                                                  o solo reaplica su apariencia a uno existente
chats context <categoría>/<mundo> <personaje> "mensaje" [--with A,B] [--as Nombre] [--at Momento]   (sin modelos)
chats chat <categoría>/<mundo> <personaje> [--with A,B] [--as Nombre] [--at Momento]
chats memory <categoría>/<mundo> <personaje> [N]  últimos N nodos aprendidos (sin modelos)
chats image <categoría>/<mundo> <personaje> [escena…]
chats stress [nodos…]                             benchmark de memoria con grafos sintéticos (sin modelos)
chats appearance <categoría>/<mundo> <personaje> ["descripción visual"]   (sin modelos)
chats reference <categoría>/<mundo> <personaje> [imágenes…] [--add] [--dry-run] [--reader <modelo>]
                                                  describe todas sus referencias con el lector de visión
chats lang [en|es]                                muestra o cambia el idioma

Se ejecuta desde la carpeta del proyecto: usa config/, models/, worlds/ y logs/.
Los comandos también aceptan su nombre en español (modelos, mundos, sembrar, contexto…).""" }
world_spec = { en = "use <category>/<world>, e.g. fantasy/aerendal", es = "usa <categoría>/<mundo>, p. ej. fantasia/aerendal" }
no_character = { en = "there is no \"{name}\" in this world (there are: {list})", es = "no hay ningún \"{name}\" en este mundo (hay: {list})" }
lang_set = { en = "Language: English", es = "Idioma: español" }
lang_unknown = { en = "unknown language \"{value}\": use en or es", es = "idioma desconocido \"{value}\": usa en o es" }
migrated = { en = "· moved {from} → {to} (new folder names)", es = "· movido {from} → {to} (nombres de carpeta nuevos)" }
no_moment = { en = "\"{name}\" is not a moment of this world's timeline (there are: {list})", es = "\"{name}\" no es un momento de la línea temporal de este mundo (hay: {list})" }

[cli.usage]
seed = { en = "usage: chats seed <file.toml> [--appearance-only]", es = "uso: chats seed <archivo.toml> [--appearance-only]" }
context = { en = "usage: chats context <category>/<world> <character> \"message\" [--with A,B] [--as Name] [--at Moment]", es = "uso: chats context <categoría>/<mundo> <personaje> \"mensaje\" [--with A,B] [--as Nombre] [--at Momento]" }
memory = { en = "usage: chats memory <category>/<world> <character> [N]", es = "uso: chats memory <categoría>/<mundo> <personaje> [N]" }
chat = { en = "usage: chats chat <category>/<world> <character> [--with A,B] [--as Name] [--at Moment]", es = "uso: chats chat <categoría>/<mundo> <personaje> [--with A,B] [--as Nombre] [--at Momento]" }
image = { en = "usage: chats image <category>/<world> <character> [scene…]", es = "uso: chats image <categoría>/<mundo> <personaje> [escena…]" }
appearance = { en = "usage: chats appearance <category>/<world> <character> [\"visual description\"]", es = "uso: chats appearance <categoría>/<mundo> <personaje> [\"descripción visual\"]" }
reference = { en = "usage: chats reference <category>/<world> <character> [images…] [--add] [--dry-run] [--reader <model>]", es = "uso: chats reference <categoría>/<mundo> <personaje> [imágenes…] [--add] [--dry-run] [--reader <modelo>]" }

